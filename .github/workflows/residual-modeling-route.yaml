name: Inspect residual-modeling CloudFront route

on:
  push:
    branches: [codex/residual-modeling-route]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read distribution without exposing credentials or origin secrets
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" > /tmp/distribution.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path('/tmp/distribution.json').read_text())
          config = response['DistributionConfig']
          def behavior(value):
              keys = ('PathPattern', 'TargetOriginId', 'ViewerProtocolPolicy', 'CachePolicyId', 'OriginRequestPolicyId', 'AllowedMethods')
              return {key: value[key] for key in keys if key in value}
          result = {
              'etag': response['ETag'],
              'aliases': config.get('Aliases'),
              'origins': [{key: origin[key] for key in ('Id', 'DomainName', 'OriginPath') if key in origin} for origin in config['Origins'].get('Items', [])],
              'default_behavior': behavior(config['DefaultCacheBehavior']),
              'behaviors': [behavior(value) for value in config.get('CacheBehaviors', {}).get('Items', [])],
          }
          Path('distribution-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: residual-route-discovery
          path: distribution-summary.json
          retention-days: 3
